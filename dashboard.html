<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Employee management system</title>
    <link rel="stylesheet" href="./assests/css/style.css" />
    <link rel="stylesheet" href="./assests/css/index.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
      integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="https://unpkg.com/aos@2.3.1/dist/aos.css" />
  </head>
  <body>
    <button class="menu-btn">
      <i class="fa-solid fa-bars"></i>
    </button>
    <div class="grid-two--cols">
      <aside class="sidebar"></aside>
      <main class="main-sidebar">
        <div class="container">
          <header class="main-sidebar--header">
            <p class="common-para" data-aos="fade-down">dashboard</p>
            <img src="./assests/imgs/avatar img.jpg" alt="default admin image" data-aos="zoom-in" />
            <div class="header-content">
              <i class="fa-solid fa-magnifying-glass"></i>
              <input
                type="text"
                name="search"
                id="search"
                placeholder="search by name , email or phone number or employee i"
              />
            </div>
          </header>
          <main class="main-sidebar--content">
            <div class="info grid grid-four-cols">
              <article class="info-card" data-aos="fade-up">
                <i class="fa-solid fa-users"></i>
                <p>total employees</p>
                <p class="total-employee">128</p>
                <p class="total">+8 this month</p>
              </article>
              <article
                class="info-card"
                data-aos="fade-up"
                data-aos-delay="100"
              >
                <i class="fa-solid fa-circle-check"></i>
                <p>active employees</p>
                <p class="active-employee">128</p>
                <p class="active">+8 this month</p>
              </article>
              <article
                class="info-card"
                data-aos="fade-up"
                data-aos-delay="200"
              >
                <i class="fa-solid fa-circle-xmark"></i>
                <p>inactive employees</p>
                <p class="inactive-employee">128</p>
                <p class="inactive">+8 this month</p>
              </article>
              <article
                class="info-card"
                data-aos="fade-up"
                data-aos-delay="300"
              >
                <i class="fa-solid fa-building"></i>
                <p>departments</p>
                <p class="department-employee">128</p>
                <p class="department">+8 this month</p>
              </article>
            </div>
            <div class="employees-content">
              <div class="employees-header">
                <p data-aos="fade-right" data-aos-delay="400">
                  recently added employees
                </p>
                <button type="button" class="viewall-btn">view all</button>
              </div>
              <main class="employees grid grid-four-cols"></main>
            </div>
            <div class="employees-empty">
              <div class="empty-icon">
                <i class="fa-solid fa-users"></i>
              </div>

              <h3>No employees yet</h3>

              <p>
                Your employee directory is empty. Add your first employee to get
                started.
              </p>

              <a href="addcontact.html" class="add-employee-btn"><i class="fa-solid fa-plus"></i>
                Add employee</a>
            </div>
          </main>
        </div>
      </main>
    </div>
  </body>
  <script type="module" src="./assests/js/index.js"></script>
  <script type="module" src="./assests/js/dashboard.js"></script>
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script>
    AOS.init({
      duration: 700,
      once: true,
      offset: 80,
    });
  </script>
</html>
